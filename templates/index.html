<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tutor-Ward Index</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>Tutor-Ward Index</h1>
        <p>Search for tutors and students.</p>

        <form id="search-form">

            <label for="search-type">Search by</label>

            <select id="search-type">
                <option value="tutor">Tutor Name</option>
                <option value="student">Student Name</option>
                <option value="regno">Registration Number</option>
            </select>

            <label for="query">Enter your search</label>

            <input
                type="text"
                id="query"
                placeholder="Enter a name or registration number"
                required
            >

            <button type="submit">Search</button>

        </form>

        <div id="message"></div>

        <div id="results"></div>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
